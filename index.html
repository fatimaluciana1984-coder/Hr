<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12a878">
  <meta name="description" content="Ajude o macaquinho a pular pelas vitórias-régias sem cair na água!">
  <title>Macaco Saltitante</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="logo" aria-label="Macaco Saltitante"><span class="logo-monkey">🐒</span><span>Macaco <b>Saltitante</b></span></div>
      <div class="score-box" aria-live="polite"><span>PONTOS</span><strong id="score">0</strong></div>
    </header>

    <section class="game-frame" aria-label="Jogo do macaco pulando na água">
      <canvas id="game" aria-label="Jogo: pule nas folhas para atravessar o rio"></canvas>
      <div class="overlay" id="overlay">
        <div class="welcome-card">
          <div class="big-monkey" id="overlay-monkey" aria-hidden="true">🐵</div>
          <p class="tagline" id="eyebrow">AVENTURA NA FLORESTA</p>
          <h1 id="headline">Macaco<br><span>Saltitante!</span></h1>
          <p class="intro" id="description">Pule de vitória-régia em vitória-régia e atravesse o rio. Cuidado para não cair na água!</p>
          <button class="play-button" id="play-button" type="button">Começar a jogar <span aria-hidden="true">➜</span></button>
          <button class="install-button" id="install-button" type="button" hidden>Instalar no celular</button>
          <p class="small-hint">Toque na tela, aperte ESPAÇO ou ↑ para pular</p>
        </div>
      </div>
    </section>

    <footer class="help"><span>🌿</span> Toque / <b>ESPAÇO</b> / <b>↑</b> para pular <span class="help-right">Boa sorte! 🍌</span></footer>
  </main>
  <script src="main.js" defer></script>
</body>
</html>
